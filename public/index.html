<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 520px;
      padding: 32px;
      height: fit-content;
    }
    h1 {
      font-size: 28px;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
    }
    h1 span { color: #6c63ff; }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }
    .input-row input:focus { border-color: #6c63ff; }
    .input-row button {
      padding: 12px 20px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-row button:hover { background: #574fd6; }
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .filters button {
      flex: 1;
      padding: 8px;
      border: 2px solid #e0e0e0;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .filters button.active {
      border-color: #6c63ff;
      background: #6c63ff;
      color: #fff;
    }
    .todo-list { list-style: none; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #f8f9fa;
      transition: background 0.2s;
    }
    .todo-item:hover { background: #f0eeff; }
    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #aaa;
    }
    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6c63ff;
      cursor: pointer;
    }
    .todo-text {
      flex: 1;
      font-size: 15px;
      color: #333;
    }
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 18px;
      line-height: 1;
      transition: color 0.2s;
    }
    .delete-btn:hover { color: #e53935; }
    .empty {
      text-align: center;
      color: #aaa;
      padding: 32px 0;
      font-size: 15px;
    }
    .footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #999;
    }
    .clear-btn {
      background: none;
      border: none;
      color: #e53935;
      cursor: pointer;
      font-size: 13px;
    }
    .clear-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ <span>Todo</span> List</h1>
    <div class="input-row">
      <input id="todoInput" type="text" placeholder="What needs to be done?" />
      <button onclick="addTodo()">Add</button>
    </div>
    <div class="filters">
      <button class="active" onclick="setFilter('all', this)">All</button>
      <button onclick="setFilter('active', this)">Active</button>
      <button onclick="setFilter('completed', this)">Completed</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
    <div class="footer">
      <span id="countLabel">0 items left</span>
      <button class="clear-btn" onclick="clearCompleted()">Clear completed</button>
    </div>
  </div>

  <script>
    let todos = [];
    let filter = 'all';

    async function fetchTodos() {
      const res = await fetch('/api/todos');
      todos = await res.json();
      render();
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      input.value = '';
      fetchTodos();
    }

    async function toggleTodo(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }

    async function deleteTodo(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }

    async function clearCompleted() {
      const completed = todos.filter(t => t.completed);
      await Promise.all(completed.map(t => fetch(`/api/todos/${t.id}`, { method: 'DELETE' })));
      fetchTodos();
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const list = document.getElementById('todoList');
      const filtered = todos.filter(t => {
        if (filter === 'active') return !t.completed;
        if (filter === 'completed') return t.completed;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">No todos here 🎉</div>';
      } else {
        list.innerHTML = filtered.map(t => `
          <li class="todo-item ${t.completed ? 'completed' : ''}">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo(${t.id}, this.checked)" />
            <span class="todo-text">${escapeHtml(t.text)}</span>
            <button class="delete-btn" onclick="deleteTodo(${t.id})">✕</button>
          </li>
        `).join('');
      }

      const active = todos.filter(t => !t.completed).length;
      document.getElementById('countLabel').textContent = `${active} item${active !== 1 ? 's' : ''} left`;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(text));
      return d.innerHTML;
    }

    document.getElementById('todoInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    fetchTodos();
  </script>
</body>
</html>
